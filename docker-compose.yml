services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-game_of_life}
      - POSTGRES_USER=${POSTGRES_USER:-game_of_life}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-game_of_life}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game_of_life} -d ${POSTGRES_DB:-game_of_life}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/backend/app  # Permet le hot-reload du code Python
    environment:
      - ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-game_of_life}:${POSTGRES_PASSWORD:-game_of_life}@db:5432/${POSTGRES_DB:-game_of_life}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/gol-fe:/frontend
      - /frontend/node_modules # Évite d'écraser les modules node du conteneur
    depends_on:
      - backend

volumes:
  postgres_data:
